apiVersion: v1
kind: Pod
metadata:
  name: edtech-nlp2sql
spec:
  containers:
    - name: api
      image: edtech-nlp2sql:latest
      ports:
        - containerPort: 8000
      env:
        - name: GROQ_API_KEY
          value: "your-api-key-here"
        - name: DATABASE_URL
          value: "sqlite:///./edtech.db"
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
        requests:
          cpu: "250m"
          memory: "256Mi"
  restartPolicy: Always